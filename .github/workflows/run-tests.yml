name: run-tests

on:
  push:
    paths:
      - '**.php'
      - .github/workflows/run-tests.yml
      - phpunit.xml.dist
      - composer.json
      - composer.lock

jobs:
  test:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.3', '8.4', '8.5', '8.6']
        laravel: ['13.*']
        stability: [prefer-lowest, prefer-stable]

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pdo, pdo_sqlite, bcmath, ctype, fileinfo, tokenizer, xml, xmlwriter
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        shell: bash
        run: |
          composer validate --strict
          composer require "laravel/framework:${{ matrix.laravel }}"  --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-stable --prefer-dist --no-interaction
          composer check-platform-reqs
          composer audit
          composer show --direct

      - name: Execute tests
        run: vendor/bin/phpunit --display-all-issues
